<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 15%, rgba(10, 132, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 82% 85%, rgba(94, 92, 230, 0.22) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 70% 20%, rgba(91, 200, 245, 0.1) 0%, transparent 50%),
      linear-gradient(155deg, #0e1520 0%, #080d16 45%, #05080e 100%);
  }

  /* Subtle grid */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* Outer glow ring */
  .glow-ring {
    position: absolute;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(10,132,255,0.07) 0%, transparent 70%);
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 680px;
    height: 680px;
    background: linear-gradient(148deg, #141e2e 0%, #0f1724 55%, #0b1020 100%);
    border-radius: 140px;
    border: 1.5px solid rgba(255,255,255,0.07);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.07),
      inset 0 -1px 0 rgba(0,0,0,0.3),
      0 0 0 1px rgba(0,0,0,0.5),
      0 60px 120px rgba(0,0,0,0.7),
      0 20px 48px rgba(0,0,0,0.5),
      0 4px 12px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    overflow: hidden;
  }

  /* Top scanline accent */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, rgba(10,132,255,0.5) 30%, rgba(91,200,245,0.6) 50%, rgba(94,92,230,0.5) 70%, transparent 95%);
  }

  /* Bottom accent line */
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 10%, rgba(10,132,255,0.3) 40%, rgba(94,92,230,0.3) 60%, transparent 90%);
    border-radius: 0 0 140px 140px;
  }

  /* Terminal window chrome */
  .terminal-chrome {
    position: absolute;
    top: 52px;
    left: 52px;
    right: 52px;
    height: 36px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red   { background: #FF5F57; }
  .dot-yellow { background: #FFBD2E; }
  .dot-green { background: #28C840; }

  /* Main code symbol */
  .code-symbol {
    font-size: 220px;
    font-weight: 800;
    letter-spacing: -6px;
    line-height: 1;
    background: linear-gradient(135deg, #5BC8F5 0%, #4EB3FF 35%, #A78BFA 70%, #818CF8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(91,200,245,0.3)) drop-shadow(0 0 80px rgba(10,132,255,0.2));
    margin-top: 10px;
    position: relative;
    z-index: 2;
  }

  /* Code lines below */
  .code-lines {
    position: absolute;
    bottom: 100px;
    left: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .code-line-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .indent { width: 32px; flex-shrink: 0; }
  .indent-2 { width: 64px; flex-shrink: 0; }

  .token {
    height: 11px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  /* Ambient corner glow */
  .corner-glow-tl {
    position: absolute;
    top: -60px; left: -60px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(10,132,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .corner-glow-br {
    position: absolute;
    bottom: -60px; right: -60px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(94,92,230,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-ring"></div>

<div class="card">
  <div class="corner-glow-tl"></div>
  <div class="corner-glow-br"></div>

  <!-- Terminal chrome bar -->
  <div class="terminal-chrome">
    <div class="dot dot-red"></div>
    <div class="dot dot-yellow"></div>
    <div class="dot dot-green"></div>
  </div>

  <!-- Main symbol -->
  <div class="code-symbol">&lt;/&gt;</div>

  <!-- Decorative code lines -->
  <div class="code-lines">
    <div class="code-line-row">
      <div class="token" style="width:56px; background:#0A84FF; opacity:0.8"></div>
      <div class="token" style="width:32px; background:rgba(255,255,255,0.15)"></div>
      <div class="token" style="width:80px; background:#5BC8F5; opacity:0.7"></div>
    </div>
    <div class="code-line-row">
      <div class="indent"></div>
      <div class="token" style="width:44px; background:#CF9FFF; opacity:0.75"></div>
      <div class="token" style="width:68px; background:rgba(255,255,255,0.12)"></div>
      <div class="token" style="width:52px; background:#FF7B72; opacity:0.7"></div>
    </div>
    <div class="code-line-row">
      <div class="indent-2"></div>
      <div class="token" style="width:36px; background:#F2CC60; opacity:0.7"></div>
      <div class="token" style="width:24px; background:rgba(255,255,255,0.1)"></div>
      <div class="token" style="width:72px; background:#32D74B; opacity:0.6"></div>
    </div>
    <div class="code-line-row">
      <div class="token" style="width:48px; background:#0A84FF; opacity:0.65"></div>
      <div class="token" style="width:90px; background:rgba(255,255,255,0.08)"></div>
    </div>
  </div>
</div>
</body>
</html>
